name: Terraform Deploy to AWS

on:
  workflow_dispatch:


jobs:
  terraform-deploy-to-aws:
    runs-on: ubuntu-latest

    # Prevent accidental deployments if someone triggers this from a non-main branch
    if: github.ref == 'refs/heads/main'

    environment: production

    steps:
    - name: Checkout Git repository
      uses: actions/checkout@v4

    - name: Configure Aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Setup
      uses: hashicorp/setup-terraform@v3

    - name: Create EC2 Keypairs
      run: sh keypairGenerator.sh

    - name: Initialize Terraform
      working-directory: terraform
      run: terraform init

    - name: Terraform Format
      working-directory: terraform
      run: terraform fmt -check

    - name: Terraform Validate
      working-directory: terraform
      run: terraform validate

    - name: Terraform Plan
      working-directory: terraform
      env:
        TF_VAR_admin_ip: ${{ secrets.TF_ADMIN_IP }}
        TF_VAR_webserver_1_name: ${{ vars.WEB_SERVER_1_NAME }}
        TF_VAR_webserver_2_name: ${{ vars.WEB_SERVER_2_NAME }}
      run: terraform plan

    - name: Terraform Deploy
      working-directory: terraform
      env:
        TF_VAR_admin_ip: ${{ secrets.TF_ADMIN_IP }}
        TF_VAR_node_name_a: ${{ vars.WEB_SERVER_1_NAME }}
        TF_VAR_node_name_b: ${{ vars.WEB_SERVER_2_NAME }}
      run: terraform apply -auto-approve
